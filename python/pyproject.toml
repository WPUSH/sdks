[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wpush"
version = "0.1.0"
description = "Official WPUSH Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "An Hao / WPUSH", email = "im@alone88.cn" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["wpush*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
